# Remote SSH relay example. Replace names, users, MAC, and home LAN addresses.
# The relay needs Tailscale + SSH key auth + Python 3; no waker-agent.
version: 1
settings:
  auto_tailscale: true # Ensure connected before network operations; leave connected on exit.
defaults:
  broadcast: 192.168.1.255 # HOME LAN broadcast, never a Tailscale address.
  wol_port: 9
  timeout: 120s
  poll_interval: 15s
  probe_timeout: 2s
  relay:
    host: home-pi # Always-on relay's MagicDNS name, Tailscale IP, or SSH alias.
    user: pi
    port: 22
    # args: ["-i", "/absolute/path/to/relay_key"]
    # source_ip: 192.168.1.2 # Relay's LAN address for multi-NIC hosts.
hosts:
  - name: desktop
    mac: AA:BB:CC:DD:EE:FF # Physical Ethernet MAC of the sleeping target.
    ip: desktop # TARGET's MagicDNS name or Tailscale IP.
    subnet_check: false # Permit routed/Tailscale checks (the default).
    ssh:
      user: tomer
      port: 22
    checks:
      - type: tcp
        port: 22
    on_connect:
      type: ssh
    on_sleep:
      type: ssh

  - name: gaming-pc
    mac: DE:AD:BE:EF:00:01
    ip: gaming-pc
    checks:
      - type: tcp
        port: 9876 # Optional sleep agent's listening port, reached over Tailscale.
    on_connect:
      type: parsec
      peer_id: "replace-with-your-peer-id"
      settings: "client_vsync=1"
    on_sleep:
      type: agent # Agent runs on the TARGET. It only provides sleep, not wake.
      port: 9876
      token_env: WAKER_AGENT_TOKEN # Manual setup only; waker setup manages credentials automatically.
# Local-only use: remove defaults.relay, use target LAN IPs, and leave
# auto_tailscale false if Tailscale is unnecessary.
